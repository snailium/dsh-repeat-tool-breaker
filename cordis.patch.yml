# dsh-repeat-tool-breaker — profile bundle patch.
#
# This file is the package's `dsh.bundle.patch` layer, declared in package.json:
#
#   "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }
#
# It is applied as ONE insert over the empty profile root, BEFORE the profile's
# own cordis.patch.yml. Two supported ways to use it:
#
# 1. As a profile BUNDLE (recommended — no hand-written mount row):
#
#      dsh plugin --profile <name> add dsh-repeat-tool-breaker
#
#    then list it in the profile manifest's ordered bundle list
#    (`dsh.profile.bundles` in `$DSH_HOME/profiles/<name>/package.json`):
#
#      "dsh": { "profile": { "bundles": [
#        "@deepseek-ai/dsh-base",
#        "@deepseek-ai/dsh-web-app",
#        "dsh-repeat-tool-breaker"
#      ] } }
#
#    Naming a bundle-less package as a layer is a hard boot error, so the
#    `dsh.bundle` manifest above is required for this path.
#
# 2. As a `--patch` overlay or a hand-merged row in the profile's own
#    cordis.patch.yml. Adding a brand-new plugin requires the `- insert:` list
#    form — a flat `- id:` entry is a RECONFIG of an already-present id and
#    reports "not found" when the plugin is not yet in the composed tree.
#
# The row below deliberately carries NO `config:`, so the plugin's own
# fail-loud DEFAULTS apply — and those DEFAULTS are exactly the table documented
# in the README (window 12; localHosts ask; limits exact/cmd/net/sink 5, and the
# volume budgets — site, family:*, verb:* — off; decoy argument names ignored on
# every tool). Restating the table here would only create a second copy that can
# silently go stale — and because ARRAYS in a patch REPLACE the default array,
# a stale two-entry `exclude:` would drop the default `todo_write` entry.
#
# To retune, RECONFIGURE the row by id from the PROFILE's own patch layer. Note
# that a patch replaces the targeted row's WHOLE `config` rather than merging
# into it, so restate every field you want. Only `ignoreArgs`, `hostAliases`
# and `limits` merge one level deep with the defaults; scalars replace and the
# arrays (`exclude`, `include`) replace outright.
#
#   - id: repeat-tool-breaker
#     config:
#       window: 12                  # recent calls per agent that are counted
#       localHosts: ask             # ask | deny | allow (ask degrades to deny with no answerer)
#       previewChars: 400           # truncation for quoted fingerprints
#       resultPreviewChars: 800     # truncation for the quoted previous result
#       exclude:
#         - todo_write              # never counted, never resets the window
#       include: []                 # non-empty = ONLY these names/patterns count
#       ignoreArgs:                 # merged over the defaults
#         '*':
#           - description             # the v1 escape hatch: decoy fields are
#           - timeoutMs               # deleted before ANY fingerprint is built
#       hostAliases:                # merged over the defaults
#         open-data.canada.ca: open.canada.ca
#       limits:                     # merged over the defaults; null = uncapped
#         exact: 5                  # deny the 5th identical (cleaned) call
#         cmd: 5                    # deny the 5th same command, flags stripped
#         net: 5                    # deny the 5th fetch of the same host+path
#         sink: 5                   # deny the 5th shell write to the same path
#         # volume budgets are OFF by default: they cannot tell a crawl from
#         # progress, and every value tried caused a false positive on a live
#         # session. Set one only if you want a crawl budget.
#         site: null
#         'family:http-fetch': null
#         'verb:curl': null
#         'verb:wget': null
#       # NOTE: there is no readpath/writepath cap. File actions are identified by
#       # POSITION through `exact:`, not by path.
#
# Using an absolute path as `name` (e.g. /path/to/index.js) also works and is
# the way to mount a CHECKOUT before it is installed into the profile.

- insert:
    - id: repeat-tool-breaker
      name: 'dsh-repeat-tool-breaker'
