name: Publish to npm

# Manual-only: nothing publishes as a side effect of a normal push or release.
#
# Auth: npm Trusted Publishing (OIDC) is the preferred path and needs no secret —
# configure this repository + this workflow filename as a trusted publisher on the
# npm package settings page, and GitHub mints a short-lived OIDC token per run
# (`id-token: write` below). A repository secret `NPM_TOKEN` is still honoured as
# a fallback for environments where trusted publishing is not set up.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify only — do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. The npm bundled with
      # Node 22 is older, so upgrade the CLI explicitly rather than relying on
      # whatever the runner happens to ship.
      - name: Ensure an npm CLI that supports Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Test
        run: npm test

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::${NAME}@${VERSION} is already on npm — bump the version first."
            exit 1
          fi
          echo "About to publish ${NAME}@${VERSION}"

      - name: Configure npm auth
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
            echo "Auth: NPM_TOKEN secret"
          else
            echo "Auth: npm Trusted Publishing (OIDC) — no token present"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public --provenance

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public
